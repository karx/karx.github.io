<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Prints — kaaro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fdfdfd;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.75rem 2rem 1.25rem;
      border-bottom: 1px solid #eee;
    }

    .back {
      color: #888;
      text-decoration: none;
      font-size: 0.875rem;
      letter-spacing: 0.01em;
    }
    .back:hover { color: #333; }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-top: 0.4rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: #888;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    /* ── Carousel ── */
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2.5rem 1.5rem 3rem;
    }

    .carousel {
      width: 100%;
      max-width: 820px;
    }

    .stage {
      position: relative;
      width: 100%;
      background: #f2f2f2;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      user-select: none;
    }

    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .stage img.visible { opacity: 1; }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      transition: background 0.15s, opacity 0.15s;
      z-index: 10;
    }
    .nav:hover { background: #fff; }
    .nav:disabled { opacity: 0; pointer-events: none; }
    .nav.prev { left: 0.875rem; }
    .nav.next { right: 0.875rem; }

    /* ── Meta ── */
    .meta {
      margin-top: 1.1rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .meta-left h2 {
      font-size: 1.05rem;
      font-weight: 600;
    }
    .meta-left p {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    .counter {
      color: #aaa;
      font-size: 0.82rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Dots ── */
    .dots {
      display: flex;
      gap: 5px;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ddd;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .dot:hover { background: #bbb; }
    .dot.active { background: #333; transform: scale(1.2); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: #aaa;
    }
    .empty p { font-size: 0.95rem; margin-top: 0.5rem; }

    /* ── Footer ── */
    footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid #f0f0f0;
      font-size: 0.82rem;
      color: #bbb;
      text-align: center;
    }
    footer a { color: #999; text-decoration: none; }
    footer a:hover { color: #555; }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .nav { width: 36px; height: 36px; font-size: 1rem; }
      .meta { flex-direction: column; gap: 0.25rem; }
      .counter { align-self: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <a class="back" href="/">← kaaro</a>
    <h1>3D Prints</h1>
    <p>Things I've printed, in no particular order.</p>
  </header>

  <main>
    <div class="carousel" id="carousel"></div>
  </main>

  <footer>
    Full album on
    <a href="https://photos.google.com/share/AF1QipPT4gMqpVX-B5M9JpEOkdBx7eCDO09TB2LH_wNRlhtfYJ2k4un0W7cbXfsqR66bqg?key=MnkzTzc0NTlnSF9CdmFHTzVGWjBYZUNIRXZCUEpB"
       target="_blank" rel="noopener">Google Photos ↗</a>
  </footer>

  <script src="data.js"></script>
  <script>
    const root = document.getElementById('carousel');

    if (!window.PRINTS || PRINTS.length === 0) {
      root.innerHTML = `
        <div class="empty">
          <div style="font-size:2.5rem">🖨</div>
          <p>Photos incoming — prints are happening, documentation is not (yet).</p>
        </div>`;
    } else {
      let current = 0;
      let preloaded = {};

      // Preload a photo
      const preload = (i) => {
        if (preloaded[i] || !PRINTS[i]) return;
        preloaded[i] = true;
        const img = new Image();
        img.src = PRINTS[i].url;
      };

      const render = () => {
        const p = PRINTS[current];
        const many = PRINTS.length > 1;

        root.innerHTML = `
          <div class="stage" id="stage">
            <button class="nav prev" id="btnPrev" aria-label="Previous">&#8249;</button>
            <img id="photo" src="${p.url}" alt="${p.title || 'Print ' + (current+1)}">
            <button class="nav next" id="btnNext" aria-label="Next">&#8250;</button>
          </div>
          <div class="meta">
            <div class="meta-left">
              <h2>${p.title || 'Print #' + (current + 1)}</h2>
              ${p.description ? `<p>${p.description}</p>` : ''}
              ${p.date ? `<p style="color:#bbb;font-size:0.8rem;margin-top:0.2rem">${p.date}</p>` : ''}
            </div>
            <span class="counter">${current + 1} / ${PRINTS.length}</span>
          </div>
          ${many ? `<div class="dots">${PRINTS.map((_, i) =>
            `<button class="dot ${i === current ? 'active' : ''}" data-i="${i}" aria-label="Go to print ${i+1}"></button>`
          ).join('')}</div>` : ''}
        `;

        // Show image with fade-in
        const img = document.getElementById('photo');
        img.onload = () => img.classList.add('visible');
        if (img.complete) img.classList.add('visible');

        // Wire nav buttons
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        if (!many) { btnPrev.disabled = true; btnNext.disabled = true; }
        btnPrev.addEventListener('click', () => go(current - 1));
        btnNext.addEventListener('click', () => go(current + 1));

        // Wire dots
        root.querySelectorAll('.dot').forEach(dot => {
          dot.addEventListener('click', () => go(parseInt(dot.dataset.i)));
        });

        // Preload neighbours
        preload(current + 1);
        preload(current - 1);
      };

      const go = (i) => {
        current = (i + PRINTS.length) % PRINTS.length;
        render();
      };

      // Keyboard
      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  go(current - 1);
        if (e.key === 'ArrowRight') go(current + 1);
      });

      // Touch / swipe
      let touchX = null;
      document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
      document.addEventListener('touchend', e => {
        if (touchX === null) return;
        const dx = touchX - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 48) go(dx > 0 ? current + 1 : current - 1);
        touchX = null;
      });

      // Initial preload
      preload(0); preload(1);
      render();
    }
  </script>

</body>
</html>
